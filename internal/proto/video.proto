syntax = "proto3";

package stream_hub.video;

option go_package = "./video";

import "google/protobuf/timestamp.proto";

service VideoService {

  rpc CreateVideo(CreateVideoRequest) returns (AuthorVideoInfo);

  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);

  rpc UpdateVideo(UpdateVideoRequest) returns (AuthorVideoInfo);

  rpc DeleteVideo(DeleteVideoRequest) returns (DeleteVideoResponse);

  rpc ListUserPublishedVideos(ListUserPublishedVideosRequest)
      returns (ListUserPublishedVideosResponse);

  rpc ListMyVideos(ListMyVideosRequest)
      returns (ListMyVideosResponse);

  rpc ListFeedVideos(ListFeedVideosRequest)
      returns (ListFeedVideosResponse);

  rpc SearchVideos(SearchVideosRequest)
      returns (SearchVideosResponse);

  rpc ListHotVideos(ListHotVideosRequest)
      returns (ListHotVideosResponse);
}

message PublicVideoInfo {
  string id = 1;
  string title = 2;
  string cover_url = 3;
  string author_id = 4;
  int64 duration = 5;
  int64 like_count = 6;
  int64 comment_count = 7;
  int64 favorite_count = 8;
  int64 view_count = 9;
  string m3u8_url = 10;
  google.protobuf.Timestamp created_at = 11;
}

message AuthorVideoInfo {
  string id = 1;
  string title = 2;
  string description = 3;
  string cover_url = 4;
  int32 is_public = 5;
  int64 duration = 6;
  int64 like_count = 7;
  int64 comment_count = 8;
  int64 favorite_count = 9;
  int64 view_count = 10;
  string m3u8_url = 11;
  int32 transcode_status = 12;
  int32 audit_status = 13;

  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message InternalVideoInfo {
  string id = 1;
  string title = 2;
  string description = 3;
  string author_id = 4;
  string cover_url = 5;
  int32 is_public = 6;
  int64 duration = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetVideoResponse {
  string id = 1;
  string title = 2;
  string cover_url = 3;
  string author_id = 4;
  int64 duration = 5;
  int64 like_count = 6;
  int64 comment_count = 7;
  int64 favorite_count = 8;
  int64 view_count = 9;
  string m3u8_url = 10;
  google.protobuf.Timestamp created_at = 11;
}

message CreateVideoRequest {
  string title = 1;
  string description = 2;
  string source_object_key = 3;
  string cover_url = 4;
}

message GetVideoRequest {
  string video_id = 1;
}

message UpdateVideoRequest {
  string video_id = 1;
  string title = 2;
  string description = 3;
  string cover_url = 4;
  int32 is_public = 5;
}

message DeleteVideoRequest {
  string video_id = 1;
}

message DeleteVideoResponse {
  bool success = 1;
  string message = 2;
}

message ListUserPublishedVideosRequest {
  string user_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message ListUserPublishedVideosResponse {
  repeated PublicVideoInfo videos = 1;
  int64 total = 2;
}

message ListMyVideosRequest {
  int32 page = 1;
  int32 size = 2;
}

message ListMyVideosResponse {
  repeated AuthorVideoInfo videos = 1;
  int64 total = 2;
}

message ListFeedVideosRequest {
  int32 page = 1;
  int32 size = 2;
  string last_id = 3;
}

message ListFeedVideosResponse {
  repeated FeedVideoInfo videos = 1;
  int64 total = 2;
  bool has_more = 3;
}

message FeedVideoInfo {
  string id = 1;
  string title = 2;
  string cover_url = 3;
  string author_id = 4;
  string author_nickname = 5;
  string author_avatar = 6;
  int64 duration = 7;
  int64 like_count = 8;
  int64 comment_count = 9;
  int64 favorite_count = 10;
  int64 view_count = 11;
  string m3u8_url = 12;
  google.protobuf.Timestamp created_at = 13;
}

message SearchVideosRequest {
  string keyword = 1;
  int32 page = 2;
  int32 size = 3;
}

message SearchVideosResponse {
  repeated PublicVideoInfo videos = 1;
  int64 total = 2;
  bool has_more = 3;
}

message ListHotVideosRequest {
  int32 page = 1;
  int32 size = 2;
}

message ListHotVideosResponse {
  repeated FeedVideoInfo videos = 1;
  int64 total = 2;
  bool has_more = 3;
}

// protoc --proto_path=. --go_out=./video --go_opt=paths=source_relative --micro_out=./video --micro_opt=paths=source_relative video.proto