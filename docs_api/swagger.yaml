definitions:
  api.CreateCommentRequest:
    properties:
      content:
        maxLength: 1000
        type: string
      parent_id:
        type: string
      reply_to_user_id:
        type: string
      video_id:
        type: string
    required:
    - content
    - video_id
    type: object
  api.CreateVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        maxLength: 5000
        type: string
      source_object_key:
        type: string
      title:
        maxLength: 100
        type: string
    required:
    - cover_url
    - source_object_key
    - title
    type: object
  api.UpdateVideoRequest:
    properties:
      cover_url:
        type: string
      description:
        maxLength: 5000
        type: string
      is_public:
        enum:
        - 0
        - 1
        type: integer
      title:
        maxLength: 100
        type: string
      video_id:
        type: string
    required:
    - video_id
    type: object
info:
  contact: {}
